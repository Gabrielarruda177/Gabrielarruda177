name: Gerar Gráfico Pac-Man

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Gerar gráfico

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Gerar cards de resumo do perfil
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Gabrielarruda177
          THEME: pacman
